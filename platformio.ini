; PlatformIO Project Configuration File
;
; Build with: pio run
; Upload to UNO with: pio run -t upload
; Monitor serial with: pio device monitor
;
; Arduino IDE alternative: open Intervalizer.ino directly.

; Todo el código vive en la raíz (convención Arduino IDE). PlatformIO debe
; mirar la raíz y excluir Documentación/ y Modelo/ (que contienen .ino de
; referencia y STLs que no deben compilarse).
[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; Limitamos la verbosidad del compilador para acelerar la compilación
build_flags = -Wall -Wno-unused-but-set-variable

; Excluye Documentación/ y Modelo/ del build (no deben compilarseporate).
build_src_filter = +<*> -<Documentación/> -<Modelo/>

; Bibliotecas necesarias (PlatformIO las descarga automáticamente)
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
